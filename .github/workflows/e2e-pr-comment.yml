# Shared workflow: posts the placeholder of the E2E control comment the moment a pull request opens. The decision
# (e2e-pr-decide.yml) fills it in later and keeps it up to date; this workflow only has to be early, because a comment
# cannot be moved and CodeRabbit posts about nine seconds after the pull request opens. The other way to be early, a job
# of the decision that starts when CI is requested, lands a few seconds later (the event waits for CI to be created).
#
# It also keeps the status block of the comment current for what no other workflow sees: the pull request is queued or
# taken out of the merge queue (`enqueued`, `dequeued`), auto-merge is turned on or off (`auto_merge_enabled`,
# `auto_merge_disabled`), and when it is closed or merged (nothing wakes the decision for a pull request that is over, so
# the comment would keep saying "in the merge queue"). On each of those this workflow rewrites only the status block
# (`manual-status`), from the live state of the pull request. `pull_request_target` is what makes it work for a pull
# request that has a merge conflict too: GitHub starts no `pull_request` workflow for one, and a pull request is taken
# out of the queue for a conflict.
#
# A repository calls it from a small workflow of its own, `e2e-comment.yml`, named `E2E comment` (see docs/CALLERS.md):
#   * trigger on `pull_request_target` (types opened, reopened, closed, enqueued, dequeued, auto_merge_enabled,
#     auto_merge_disabled). It runs from the default branch, so it has the secret for any pull request, a fork's
#     included, and it checks out nothing of the pull request;
#   * give the calling job no permissions at all (`permissions: {}`): the comment is written with the app token;
#   * pass the secret OSAC_CI_APP_PRIVATE_KEY explicitly (never `secrets: inherit`);
#   * list `E2E comment` in the `workflow_run` trigger of `e2e-pr.yml`: its decision then deletes the finished run, whose
#     row would stay on the pull request page (like the review relay).
# Only the pull request of a member of the organization gets a comment.
name: E2E comment

on:  # zizmor: ignore[dangerous-triggers] -- shared workflow, called from a pull_request_target caller; no pull request code runs
  workflow_call:
    inputs:
      cheap-workflows:
        description: >-
          JSON list of the names of the repository's own workflows (`["CI"]`) whose jobs the status in the control
          comment lists next to the E2E suites; `[]`: none
        type: string
        default: "[]"
      app-id:
        description: Id of the OSAC CI app
        type: string
        default: "4966101"
    secrets:
      OSAC_CI_APP_PRIVATE_KEY:
        description: Private key of the OSAC CI app (an organization secret)
        required: true

permissions: {}

jobs:
  comment:
    name: Post the E2E comment
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Token of the OSAC CI app, for the comment
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: write  # a comment on a pull request needs this one
          permission-members: read
          permission-contents: ${{ github.event.action != 'opened' && github.event.action != 'reopened' && 'read' || '' }}  # the CODEOWNERS of the base branch, for the code owners row
          permission-checks: ${{ github.event.action != 'opened' && github.event.action != 'reopened' && 'read' || '' }}  # the status block reads the checks
          permission-actions: ${{ github.event.action != 'opened' && github.event.action != 'reopened' && 'read' || '' }}  # and the run behind each, for the jobs of the cheap workflows
          permission-statuses: ${{ github.event.action != 'opened' && github.event.action != 'reopened' && 'read' || '' }}
          permission-issues: ${{ github.event.action != 'opened' && github.event.action != 'reopened' && 'write' || '' }}  # and edits the comment
      # `$/` is this workflow's own repository at the exact commit the caller pinned (see e2e-pr-decide.yml).
      - uses: $/.github/actions/early-comment
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          number: ${{ github.event.pull_request.number }}
          author: ${{ github.event.pull_request.user.login }}
          fresh: ${{ github.event.action == 'opened' }}
      - uses: $/.github/actions/manual-status
        if: github.event.action != 'opened' && github.event.action != 'reopened'
        with:
          cheap-workflows: ${{ inputs.cheap-workflows }}
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          number: ${{ github.event.pull_request.number }}
