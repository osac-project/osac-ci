---
name: osac-ci-queue

# Posts the planner's verdict for a merge-queue commit as the "OSAC CI" check run on that commit.
# Informational for now: the check is not required, so a bug here cannot block a merge.
#
# The queue runs the required checks on its own commit and waits for all of them, so the verdict has to be on that
# commit too, and it has to change when the last required check finishes. Two events say that, and both always run the
# workflow from the default branch (a `merge_group` workflow would run the file from the queue commit itself, which
# contains the pull request's own changes, so it is not used):
# * `workflow_run`: a GitHub Actions workflow finished. This is the one that matters, because GitHub does not trigger
#   `check_run` workflows when the check suite was created by GitHub Actions or its head SHA is associated with it
#   (to prevent recursive workflows). It takes exact workflow names, no wildcards: list every workflow that produces a
#   required check, and keep the list in step with the policy.
# * `check_run`: a check from another app finished (Actions-created ones never arrive this way).
#
# Safety rules for this file (it runs with write access to checks):
# * it never checks out or runs pull request code: checkout is pinned to the default branch;
# * it uses the built-in token only: no environment, no secret, no organization lookups (a queue commit has no author
#   or reviews to judge);
# * the commit and branch come from the event, but are validated by the program (40 hex digits, a queue branch name)
#   and passed through environment variables, never the script text;
# * the verdict is computed from live API state, so a stale event cannot post a stale result.
on:  # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or run; event values reach the shell as env data only
  workflow_run:
    workflows: [ci]
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Merge-queue commit to evaluate (40 hex digits)
        required: true
      branch:
        description: Its queue branch, gh-readonly-queue/<base>/pr-<n>-<sha>
        required: true

permissions:
  contents: read

# One group per commit. A newer run reads newer state, so an older one may be cancelled.
concurrency:
  group: osac-ci-queue-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || inputs.sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish
    # Only runs and checks of a queue branch, and never our own checks (their completion would only trigger another run).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'merge_group'
        && startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/')
      ) || (
        github.event_name == 'check_run'
        && startsWith(github.event.check_run.check_suite.head_branch, 'gh-readonly-queue/')
        && github.event.check_run.name != 'OSAC CI'
        && github.event.check_run.name != 'OSAC CI authorization') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # check out the default branch
      checks: write  # post the OSAC CI check run on the queue commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.11.21
      - name: Install dependencies
        run: uv sync --locked
      - name: Post the verdict on the queue commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || inputs.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.event.check_run.check_suite.head_branch || inputs.branch }}
        run: |
          uv run osac-ci publish-queue --policy policy/osac-ci.yml --repo "$REPO" --sha "$SHA" --branch "$BRANCH" \
            --note "Informational for now: this check is not required to merge."
