---
# Shared workflow: a suite that had ended goes again, so its line on the pull request and the `E2E` check say so. A suite is a
# run of its own (its job in the policy names a `workflow`), and a person can run a failed one again with the button of
# the Actions page ("Re-run failed jobs" or "Re-run all jobs"). GitHub sends `workflow_run` `in_progress` for the second
# attempt, and nothing else (no `requested`), so this is the one moment the pull request can be told. Without it the line
# says `Failed` with a link to the job of the first attempt, and `E2E` says `Failed`, until the new attempt ends.
#
# What it does: the line of the suite says `Running` (or `Waiting for a runner`) and links to the job of the new attempt;
# the `E2E` check, when it is a wait or a failure, waits for the suite (`Waiting: <suite> running again`). The end of the
# attempt is heard by the `suite-ended` job of the decision workflow (`completed`), as before. The event arrives once for
# the attempt, but a job of the attempt starting can send it again: a second one that finds the line saying what it would
# write changes nothing. Nothing in the event is believed on its own (a person with write access can start the workflow
# with any inputs): the program checks the name of the run, the workflow against the policy and the commit against the head
# of the pull request (src/osac_ci/e2e_dispatch.py).
#
# What the caller must do (the contract):
#   * a workflow of its own (e2e-pr-rerun.yml) that triggers on `workflow_run` of the workflows of its suites, types
#     `in_progress` only, and calls this one. The decision workflow is not the place: `in_progress` is also sent for every
#     job of CI and the like, and each of those would wake it;
#   * give the calling job `contents: read` and `pull-requests: write` (the control comment is edited with the workflow's
#     own token, which wakes no `issue_comment` run);
#   * pass the secret OSAC_CI_APP_PRIVATE_KEY explicitly (never `secrets: inherit`), and the same `lines-kind` as the rest of
#     the flow.
name: E2E suite goes again

on:  # zizmor: ignore[dangerous-triggers] -- shared workflow, called from a workflow_run caller; no pull request code runs
  workflow_call:
    inputs:
      policy-file:
        description: The repository's E2E policy (suites and path filters), read from its default branch
        type: string
        default: .github/e2e-policy.yml
      filters-file:
        description: The repository's shared path filters, read from its default branch (the policy points at it)
        type: string
        default: .github/filters/ci-filters.yml
      app-id:
        description: Id of the OSAC CI app
        type: string
        default: "4966101"
      lines-kind:
        description: >-
          Where the lines of the suites (`E2E / VMaaS Full Install`) are written: `checks` or `statuses`. Give every
          workflow of the flow the same value.
        type: string
        default: checks
    secrets:
      OSAC_CI_APP_PRIVATE_KEY:
        description: Private key of the OSAC CI app (an organization secret)
        required: true

permissions: {}

jobs:
  # Two jobs because the concurrency group has to hold the commit, which only a step can read out of the run name.
  find:
    name: Find the suite that goes again
    if: >-
      github.event_name == 'workflow_run' && github.event.action == 'in_progress' &&
      github.event.workflow_run.run_attempt > 1 && github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.display_title, 'E2E suite · ')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      sha: ${{ steps.name.outputs.sha }}
    steps:
      - name: Read the name of the run
        id: name
        env:
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          pattern='^E2E suite · [a-z0-9][a-z0-9_-]{0,39} · #[0-9]+ · ([0-9a-f]{40})$'
          if [[ "${TITLE}" =~ ${pattern} ]]; then
            echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The run is not named like the run of a suite: nothing to do."
          fi

  restarted:
    name: Show the suite that goes again
    needs: find
    if: needs.find.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same group as the finish and the suite-ended jobs: the check is written from the lines, so each of them reads what
    # the other left. `queue: max` keeps every one waiting.
    concurrency:
      group: e2e-finish-${{ needs.find.outputs.sha }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read  # check out the policy
      pull-requests: write  # edit the control comment quietly (edit-token below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            ${{ inputs.policy-file }}
            ${{ inputs.filters-file }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Token of the OSAC CI app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-actions: read
          permission-statuses: ${{ inputs.lines-kind == 'statuses' && 'write' || '' }}  # the suite lines, when statuses
          permission-issues: write
          permission-pull-requests: write
          permission-members: read
          permission-contents: read  # the CODEOWNERS of the base branch, for the code owners row of the status
      - uses: $/.github/actions/e2e-suite-restarted
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          policy-file: ${{ github.workspace }}/${{ inputs.policy-file }}
          run-id: ${{ github.event.workflow_run.id }}
          title: ${{ github.event.workflow_run.display_title }}
          workflow-path: ${{ github.event.workflow_run.path }}
          lines-kind: ${{ inputs.lines-kind }}
      # The control comment shows what each suite's line says: refresh it. A failure here must not matter.
      - name: Number of the pull request
        id: pull
        env:
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          number="${TITLE#*#}"
          echo "number=${number%% *}" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/manual-comment
        continue-on-error: true
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          org-token: ${{ steps.app-token.outputs.token }}
          edit-token: ${{ github.token }}
          repo: ${{ github.repository }}
          number: ${{ steps.pull.outputs.number }}
          policy-file: ${{ github.workspace }}/${{ inputs.policy-file }}
