---
name: Publish the OSAC CI check
description: >-
  Evaluate pull requests with an osac-ci policy and post the verdict as the "OSAC CI" check run. A repository calls
  this from its own workflow, pinned to a commit of osac-ci, so the code, the policy and the pinned commit change
  together and only through a reviewed change.

# The calling workflow decides when this runs, what token it holds and what concurrency applies. This action never
# checks out the calling repository, so it cannot run pull request code. Every input reaches the shell through an
# environment variable, never through the script text.
inputs:
  github-token:
    description: Token that can write checks and read pull requests (normally the job's built-in token)
    required: true
  repo:
    description: Repository to evaluate, owner/name
    required: true
  policy:
    description: Policy file, relative to the root of osac-ci at the pinned commit
    default: policy/osac.yml
  number:
    description: Pull request number. Empty means the pull request is found from head-owner and head-branch
    default: ""
  head-owner:
    description: Owner of the repository the pull request branch lives in (from a workflow_run event)
    default: ""
  head-branch:
    description: Branch of the pull request (from a workflow_run event). Treated as data
    default: ""
  sweep:
    description: With no pull request given, evaluate open pull requests within the budget below ("true" or "false")
    default: "false"
  recent:
    description: Sweep, most recently updated pull requests to look at every time
    default: "15"
  rotate:
    description: Sweep, further pull requests per run, a different slice each time
    default: "15"
  reserve:
    description: Sweep, stop starting pull requests when fewer REST requests than this are left
    default: "150"
  interval:
    description: Sweep, seconds between scheduled runs (must match the schedule so the rotation advances one slice a run)
    default: "1800"
  note:
    description: Text placed above the verdict in the check summary
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Find the pull request
      id: target
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        NUMBER: ${{ inputs.number }}
        HEAD_OWNER: ${{ inputs.head-owner }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        SWEEP: ${{ inputs.sweep }}
      run: |
        set -euo pipefail
        if [ -z "$NUMBER" ] && [ -n "$HEAD_BRANCH" ]; then
          # The "which pull request contains this commit" lookup is empty for a pull request from a fork, so ask for the
          # open pull request that has this owner and branch as its head (the owner narrows it to one fork).
          NUMBER=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" --jq '.[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "::notice::No open pull request has this branch as its head; nothing to evaluate."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        case "$NUMBER" in
          *[!0-9]*) echo "::error::The pull request number must be digits only."; exit 1 ;;
        esac
        if [ -n "$NUMBER" ]; then
          echo "mode=one" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
        elif [ "$SWEEP" = "true" ]; then
          echo "mode=sweep" >> "$GITHUB_OUTPUT"
        else
          echo "mode=none" >> "$GITHUB_OUTPUT"
        fi
    - name: Post the verdict
      if: steps.target.outputs.mode != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        POLICY: ${{ inputs.policy }}
        MODE: ${{ steps.target.outputs.mode }}
        NUMBER: ${{ steps.target.outputs.number }}
        RECENT: ${{ inputs.recent }}
        ROTATE: ${{ inputs.rotate }}
        RESERVE: ${{ inputs.reserve }}
        INTERVAL: ${{ inputs.interval }}
        NOTE: ${{ inputs.note }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        note=()
        if [ -n "$NOTE" ]; then note=(--note "$NOTE"); fi
        if [ "$MODE" = "one" ]; then
          target=(--number "$NUMBER")
        else
          target=(--all --recent "$RECENT" --rotate "$ROTATE" --reserve "$RESERVE" --interval "$INTERVAL")
        fi
        # --project makes uv use the locked environment of osac-ci at the pinned commit, wherever the job runs.
        uv run --locked --project "$root" osac-ci publish --policy "$root/$POLICY" --repo "$REPO" "${target[@]}" "${note[@]}"
