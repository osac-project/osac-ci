---
name: Publish the OSAC CI check
description: >-
  Evaluate pull requests with an osac-ci policy and post the verdict as the "OSAC CI" check run. A repository calls
  this from its own workflow, pinned to a commit of osac-ci, so the code, the policy and the pinned commit change
  together and only through a reviewed change.

# The calling workflow decides when this runs, what token it holds and what concurrency applies. This action never
# checks out the calling repository, so it cannot run pull request code. Every input reaches the shell through an
# environment variable, never through the script text.
inputs:
  github-token:
    description: Token that can write checks and read pull requests (normally the job's built-in token)
    required: true
  org-token:
    description: >-
      Token that can read organization membership and teams (a short-lived app token). It is used for author lookups when
      lookup-membership is "true", and always for the members of CODEOWNERS teams, which a policy with native approval needs
    default: ""
  lookup-membership:
    description: >-
      "true" to look up the membership of the author and of whoever authorized a commit with org-token. A missing or
      unusable token then makes the verdict a visible planner-error, never a pass. Otherwise membership is approximated
      from the author association. It does not control the owner-team lookups of native approval (see org-token)
    default: "false"
  repo:
    description: Repository to evaluate, owner/name
    required: true
  policy:
    description: Policy file, relative to the root of osac-ci at the pinned commit
    default: policy/osac.yml
  number:
    description: Pull request number (exactly one). Empty means the pull request is found from head-sha
    default: ""
  head-sha:
    description: >-
      Head commit of the workflow run that finished (from a workflow_run event). The open pull request(s) with exactly
      this head are evaluated. The run's head owner and branch are not used: for a run started by a review they name the
      base repository, so they cannot identify the pull request
    default: ""
  sweep:
    description: With no pull request given, evaluate open pull requests within the budget below ("true" or "false")
    default: "false"
  stale-only:
    description: >-
      "true" to make a sweep read only the pull requests whose posted verdict is missing, a planner error, older than
      the pull request's last change, stuck in progress or old, found from one listing. It replaces recent and rotate,
      which are then ignored
    default: "false"
  verdict-app-id:
    description: >-
      Stale-only sweep, id of the GitHub App that posts the verdicts. The default is the built-in token of Actions;
      use 0 when the check is posted with another app's token
    default: "15368"
  stale-after:
    description: Stale-only sweep, seconds an in-progress verdict may stand before it is looked at again
    default: "1800"
  max-age:
    description: Stale-only sweep, refresh any verdict older than this many seconds (0 for never)
    default: "21600"
  recent:
    description: Sweep, most recently updated pull requests to look at every time
    default: "15"
  rotate:
    description: Sweep, further pull requests per run, a different slice each time
    default: "15"
  reserve:
    description: Sweep, stop starting pull requests when fewer REST requests than this are left
    default: "150"
  interval:
    description: Sweep, seconds between scheduled runs (must match the schedule so the rotation advances one slice a run)
    default: "1800"
  note:
    description: Text placed above the verdict in the check summary
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Find the pull request
      id: target
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        NUMBER: ${{ inputs.number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SWEEP: ${{ inputs.sweep }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        numbers=""
        if [ -n "$NUMBER" ]; then
          # An explicit number is exactly one pull request.
          case "$NUMBER" in
            *[!0-9]*) echo "::error::The pull request number must be digits only."; exit 1 ;;
          esac
          numbers="$NUMBER"
        elif [ -n "$HEAD_SHA" ]; then
          # A pull request from a fork is not listed on the run, and the commit lookup is empty for one, so ask for the
          # open pull request(s) with this exact head (see osac-ci find-pr). No match is not an error.
          found=$(uv run --locked --project "$ACTION_PATH/../../.." osac-ci find-pr --repo "$REPO" --sha "$HEAD_SHA")
          case "$found" in
            *[!0-9[:space:]]*) echo "::error::The pull request lookup must print digits only."; exit 1 ;;
          esac
          numbers=$(printf '%s' "$found" | tr '\n' ' ' | sed 's/ *$//')
          if [ -z "$numbers" ]; then
            echo "::notice::No open pull request has this head."
          fi
        fi
        if [ -n "$numbers" ]; then
          echo "mode=one" >> "$GITHUB_OUTPUT"
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
        elif [ "$SWEEP" = "true" ]; then
          echo "mode=sweep" >> "$GITHUB_OUTPUT"
        else
          echo "mode=none" >> "$GITHUB_OUTPUT"
        fi
    - name: Post the verdict
      if: steps.target.outputs.mode != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        POLICY: ${{ inputs.policy }}
        MODE: ${{ steps.target.outputs.mode }}
        NUMBERS: ${{ steps.target.outputs.numbers }}
        RECENT: ${{ inputs.recent }}
        ROTATE: ${{ inputs.rotate }}
        RESERVE: ${{ inputs.reserve }}
        INTERVAL: ${{ inputs.interval }}
        STALE_ONLY: ${{ inputs.stale-only }}
        VERDICT_APP_ID: ${{ inputs.verdict-app-id }}
        STALE_AFTER: ${{ inputs.stale-after }}
        MAX_AGE: ${{ inputs.max-age }}
        NOTE: ${{ inputs.note }}
        LOOKUP_MEMBERSHIP: ${{ inputs.lookup-membership }}
        OSAC_CI_ORG_TOKEN: ${{ inputs.org-token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        note=()
        if [ -n "$NOTE" ]; then note=(--note "$NOTE"); fi
        lookup=()
        if [ "$LOOKUP_MEMBERSHIP" = "true" ]; then lookup=(--lookup-membership --require-org-token); fi
        publish() {
          # --project makes uv use the locked environment of osac-ci at the pinned commit, wherever the job runs.
          uv run --locked --project "$root" osac-ci publish --policy "$root/$POLICY" --repo "$REPO" "$@" "${lookup[@]}" "${note[@]}"
        }
        if [ "$MODE" = "one" ]; then
          # Usually one pull request; more only if several open ones have the same head commit.
          # Try every one even if an earlier one fails, then fail the step if any did.
          failed=0
          for number in $NUMBERS; do
            publish --number "$number" || failed=1
          done
          exit "$failed"
        else
          target=(--all --reserve "$RESERVE")
          if [ "$STALE_ONLY" = "true" ]; then
            target+=(--stale-only --stale-after "$STALE_AFTER" --max-age "$MAX_AGE" --verdict-app-id "$VERDICT_APP_ID")
          else
            target+=(--recent "$RECENT" --rotate "$ROTATE" --interval "$INTERVAL")
          fi
          publish "${target[@]}"
        fi
