---
name: Stop a merge queue run when a suite fails
description: >-
  Watch the suite jobs of a merge queue run and, as soon as one of them fails, ask GitHub to cancel the run. The run's
  finish job (which always runs) then writes the required E2E check as failed, so the queue entry is removed at once
  instead of waiting for the other suites to end. Run it as a job next to the suite jobs, in the same workflow run.
  Called from a workflow of osac-ci, pinned to a commit, like the other actions.

# The calling workflow holds the token (the job's built-in token, with actions: write). This action never checks out the
# calling repository, so it cannot run its code. Every input reaches the shell through an environment variable, never
# through the script text.
inputs:
  github-token:
    description: Token that can read the jobs of the run and cancel it (actions write)
    required: true
  repo:
    description: Repository, owner/name
    required: true
  suites:
    description: JSON list of the suite ids the plan selected (the suites output of the plan)
    required: true
  run-id:
    description: The workflow run that holds the suite jobs
    default: ${{ github.run_id }}
  timeout:
    description: Seconds to watch before giving up
    default: "14400"
  interval:
    description: Seconds between two looks at the jobs
    default: "30"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Watch the suites
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        SUITES: ${{ inputs.suites }}
        RUN_ID: ${{ inputs.run-id }}
        TIMEOUT: ${{ inputs.timeout }}
        INTERVAL: ${{ inputs.interval }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        case "$RUN_ID" in "" | *[!0-9]*) echo "::error::The run id must be digits only."; exit 1 ;; esac
        case "$TIMEOUT" in "" | *[!0-9]*) echo "::error::The timeout must be digits only."; exit 1 ;; esac
        case "$INTERVAL" in "" | *[!0-9]*) echo "::error::The interval must be digits only."; exit 1 ;; esac
        uv run --locked --project "$root" osac-ci e2e-queue-fail-fast --repo "$REPO" --run-id "$RUN_ID" \
          --suites "$SUITES" --timeout "$TIMEOUT" --interval "$INTERVAL"
