name: Cancel the E2E of older commits
description: >-
  Cancel the E2E run of an older commit of a pull request, which is of no use any more and holds a runner. The run is found
  by what the older commit's own E2E line says (`Running: ...`, with a link to its workflow run), so a run title needs no
  commit. Called from a workflow of osac-ci, pinned to a commit, like the other actions.

# The calling workflow holds the token (its own: actions write, checks read, contents read, pull requests read). This
# action never checks out the calling repository, so it cannot run pull request code. Every input reaches the shell
# through an environment variable, never through the script text.
inputs:
  github-token:
    description: Token that reads the pull request and its commits' checks and cancels workflow runs
    required: true
  repo:
    description: Repository, owner/name
    required: true
  number:
    description: Pull request number
    required: true
  head-sha:
    description: The head commit of the pull request that was decided on (40 hex digits); its run is left alone
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Cancel
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        NUMBER: ${{ inputs.number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        case "$NUMBER" in
          "" | *[!0-9]*) echo "::error::The pull request number must be digits only."; exit 1 ;;
        esac
        # --project makes uv use the locked environment of osac-ci at the pinned commit, wherever the job runs.
        uv run --locked --project "$root" osac-ci cancel-older --repo "$REPO" --number "$NUMBER" --head-sha "$HEAD_SHA"
