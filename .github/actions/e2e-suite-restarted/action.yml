name: Show a suite that goes again
description: >-
  A suite that had ended is going again (GitHub's "Re-run" of its run, which sends `workflow_run` `in_progress` for the
  second attempt and nothing else): show it on its line, linked to the job of the new attempt, and make the `E2E` check
  wait for it (`Waiting: <suite> running again`) instead of saying `Failed`. The end of the attempt is added up by the
  `suite-ended` action. Called from the re-run workflow of osac-ci, pinned to a commit, like the other actions.

# The event is not believed on its own: a person with write access can start a suite's workflow with any inputs. The
# program checks that the name of the run is the one the suite's workflow gives it, that the workflow is the one the
# policy names for that suite, and that the commit is still the head of the pull request (see
# src/osac_ci/e2e_dispatch.py). This action never checks out the calling repository, so it cannot run pull request code.
# Every input reaches the shell through an environment variable, never through the script text.
inputs:
  github-token:
    description: Token of the OSAC CI app (checks write, actions read, pull requests read; statuses write for lines-kind statuses)
    required: true
  repo:
    description: Repository, owner/name
    required: true
  policy-file:
    description: The repository's E2E policy, read from its default branch (a path of the workspace)
    required: true
  run-id:
    description: The id of the run that goes again (github.event.workflow_run.id)
    required: true
  title:
    description: The name of that run (github.event.workflow_run.display_title)
    required: true
  workflow-path:
    description: The workflow file of that run (github.event.workflow_run.path)
    required: true
  lines-kind:
    description: Where the lines are written, "statuses" or "checks" (the same as the other workflows of the flow)
    default: checks

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Show the suite that goes again
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        POLICY: ${{ inputs.policy-file }}
        RUN_ID: ${{ inputs.run-id }}
        TITLE: ${{ inputs.title }}
        WORKFLOW_PATH: ${{ inputs.workflow-path }}
        LINES_KIND: ${{ inputs.lines-kind }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        case "$RUN_ID" in
          "" | *[!0-9]*) echo "::error::The run id must be digits only."; exit 1 ;;
        esac
        case "$LINES_KIND" in
          statuses | checks) ;;
          *) echo "::error::The lines kind must be statuses or checks."; exit 1 ;;
        esac
        # --project makes uv use the locked environment of osac-ci at the pinned commit, wherever the job runs.
        uv run --locked --project "$root" osac-ci e2e-suite-restarted --policy "$POLICY" --repo "$REPO" --run-id "$RUN_ID" \
          --title "$TITLE" --workflow-path "$WORKFLOW_PATH" --lines-kind "$LINES_KIND" \
          | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
