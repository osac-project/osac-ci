---
name: Show the E2E decision on the pull request and claim the start
description: >-
  Take the answer of e2e-decide and keep the pull request's single status named E2E up to date: what the E2E waits for,
  that the change is not affected, or that this workflow run has claimed the start. Answers start=true only to the one run
  that may start the suites (a commit gets its E2E once; a run that died is replaced). Called
  from a workflow of the repository that runs on the default branch, pinned to a commit of osac-ci, like the other
  actions.

# The calling workflow must run one decision at a time per head commit (a concurrency group keyed by the commit, without
# cancel-in-progress), so two runs never claim the same commit together. It decides when this runs and what token it
# holds: statuses: write (to write the status), actions: read
# (to ask whether an earlier run is still going) and pull-requests: read. This action never checks out the calling
# repository, so it cannot run pull request code. Every input reaches the shell through an environment variable, never
# through the script text.
inputs:
  github-token:
    description: Token that can write commit statuses and read workflow runs (normally the job's built-in token)
    required: true
  repo:
    description: Repository, owner/name
    required: true
  decision-file:
    description: The json-file output of the e2e-decide action (empty or missing means there is nothing to report)
    default: ""
  run-id:
    description: The workflow run that would start the suites
    default: ${{ github.run_id }}
  run-url:
    description: Link of that run, shown with the status
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  kind:
    description: >-
      Where the lines are written: "statuses" (commit statuses, shown with a yellow dot) or "checks" (check runs of the
      app whose token is given, shown with a spinner; the token must be an app installation token with checks: write)
    default: statuses
  lines-kind:
    description: >-
      Where the lines of the suites are written, when that is not where the E2E line goes: "statuses" (the row of a
      status links straight to the job, with a dot instead of a spinner; the token needs statuses: write) or "checks".
      Empty: as `kind`
    default: ""

outputs:
  start:
    description: >-
      "true" only for the one run that may start the suites now. A string: compare it with 'true' (the string "false" is
      truthy in an expression)
    value: ${{ steps.report.outputs.start }}
  sha:
    description: The head commit the answer is for (empty when nothing was reported)
    value: ${{ steps.report.outputs.sha }}
  state:
    description: waiting, running, not-affected, already-running, already-ran or ignored
    value: ${{ steps.report.outputs.state }}
  suites:
    description: >-
      JSON list of the suites that run as jobs of the calling workflow's own run, such as ["vmaas","caas"]. A suite whose
      job in the policy names a `workflow` is not in it: the decision dispatches it (see `dispatched`)
    value: ${{ steps.report.outputs.suites }}
  suite-checks:
    description: >-
      JSON object, suite id -> line name on the pull request, of those suites (the "check" of each suite in the policy);
      pass it to e2e-suites-track and e2e-suites-settle
    value: ${{ steps.report.outputs.suite-checks }}
  dispatched:
    description: >-
      JSON list of the suites that run as a run of their own, each {"suite","workflow","check","tier"}: pass it to
      e2e-dispatch. Empty list when none
    value: ${{ steps.report.outputs.dispatched }}
  all-suites:
    description: JSON list of every suite the decision starts, the dispatched ones too
    value: ${{ steps.report.outputs.all-suites }}
  all-suite-checks:
    description: JSON object, suite id -> line name, of every suite the decision starts, the dispatched ones too
    value: ${{ steps.report.outputs.all-suite-checks }}
  cancel:
    description: >-
      JSON list of the workflow runs a request by hand replaces (a suite that ran with another tier): the calling
      workflow stops them. Empty list when none
    value: ${{ steps.report.outputs.cancel }}
  tiers:
    description: >-
      JSON object, suite id -> tier, of the suites a person started through a variant of the suite in the control comment
      (for example {"caas":"regression"}); the job of that suite passes it on. Empty object when none
    value: ${{ steps.report.outputs.tiers }}
  number:
    description: Number of the pull request (empty when nothing was reported)
    value: ${{ steps.report.outputs.number }}

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Report
      id: report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        DECISION: ${{ inputs.decision-file }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_URL: ${{ inputs.run-url }}
        KIND: ${{ inputs.kind }}
        LINES_KIND: ${{ inputs.lines-kind }}
        ACTION_PATH: ${{ github.action_path }}
        OUT_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        case "$KIND" in
          statuses | checks) ;;
          *) echo "::error::The kind must be statuses or checks."; exit 1 ;;
        esac
        case "$LINES_KIND" in
          "" | statuses | checks) ;;
          *) echo "::error::The lines kind must be statuses or checks."; exit 1 ;;
        esac
        case "$RUN_ID" in
          "" | *[!0-9]*) echo "::error::The run id must be digits only."; exit 1 ;;
        esac
        if [ -z "$DECISION" ] || [ ! -s "$DECISION" ]; then
          echo "::notice::There is no decision to report."
          {
            echo "start=false"
            echo "sha="
            echo "state=ignored"
            echo "suites=[]"
            echo "suite-checks={}"
            echo "dispatched=[]"
            echo "all-suites=[]"
            echo "all-suite-checks={}"
            echo "tiers={}"
            echo "cancel=[]"
            echo "number="
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        json="$OUT_DIR/e2e-report.json"
        # --project makes uv use the locked environment of osac-ci at the pinned commit, wherever the job runs.
        uv run --locked --project "$root" osac-ci e2e-report --repo "$REPO" --decision-file "$DECISION" \
          --run-id "$RUN_ID" --run-url="$RUN_URL" --json-file "$json" --kind "$KIND" \
          ${LINES_KIND:+--lines-kind "$LINES_KIND"} | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
        {
          echo "start=$(jq -r '.start' "$json")"
          echo "sha=$(jq -r '.sha' "$json")"
          echo "state=$(jq -r '.state' "$json")"
          echo "suites=$(jq -c '.inline_suites // .suites' "$json")"
          echo "suite-checks=$(jq -c '.inline_suite_checks // .suite_checks // {}' "$json")"
          echo "dispatched=$(jq -c '.dispatched // []' "$json")"
          echo "all-suites=$(jq -c '.suites' "$json")"
          echo "all-suite-checks=$(jq -c '.suite_checks // {}' "$json")"
          echo "tiers=$(jq -c '.tiers // {}' "$json")"
          echo "cancel=$(jq -c '.cancel // []' "$json")"
          echo "number=$(jq -r '.number // empty' "$json")"
        } >> "$GITHUB_OUTPUT"
