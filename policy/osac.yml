# OSAC CI policy v0: TODAY's rules, not the target rules.
#
# Encodes the merge-required contexts of the live `ci-status-checks` ruleset (26). `check-labels` is not a job
# here: its meaning lives in `merge:` below, so a missing label is reported as "awaiting approval" rather than as a
# failed check. tests/unit/test_osac_policy.py proves that, leaving out the folder-scoped jobs (osac-ui below), jobs +
# check-labels == the recorded ruleset.
#
# Path filters: each workflow decides today whether it applies with dorny/paths-filter on the shared ci-filters.yml
# and reports a skipped or green check, so the planner reads the outcome. Each job below names the filters its
# workflow gates on (filters = all of them, filters_any = at least one, as the workflows' `if:` expressions combine
# them). In `shadow` mode the filters decide nothing: a verdict note says where a filter and what the check did
# disagree (a failure on files the filters call irrelevant, or a skip on files they call relevant), and
# `osac-ci replay` counts those. Switch to `enforce` once the replay shows the mapping agrees. Jobs without filters
# (pre-commit, dependency-review) always apply.
# Approval is by the `lgtm` / `approved` labels (merge.required_labels). To move to native reviews plus CODEOWNERS with
# approvals that survive a rebase, add an `approval:` section and drop those two labels (see README).
# Changes here alter merge behavior: they need review by @osac-project/wg-infra (see CODEOWNERS).
version: 1
repo: osac-project/osac

path_filters:
  mode: shadow
  file: osac-filters.yml

# The files that define the checks every pull request is judged by. A PR can change them, and then a passing check
# proves little (a job changed to end with `exit 0` still reports success), so a change needs an approval from the
# infrastructure group. Markdown inside those folders (a README) cannot change a check and is not covered, and neither
# is documentation next to them (.github/*.md). The rule is in this file, not in the PR, so a PR cannot change who has
# to approve. Needs the organization token, to read the team.
protected_paths:
  - paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/filters/**"
      - "CODEOWNERS"
      - ".pre-commit-config.yaml"
    exclude_paths: ["**/*.md"]
    approvers: ["@osac-project/wg-infra"]

merge:
  required_labels: [lgtm, approved, jira/valid-reference]
  blocking_labels:
    - do-not-merge/hold
    - do-not-merge/work-in-progress
    - do-not-merge/invalid-owners-file
    - needs-rebase

jobs:
  # Cost-gated full-install E2E: unlocked by lgtm, /e2e-ready or a CodeRabbit approval (needs_readiness).
  e2e-vmaas:
    kind: e2e
    check: e2e-vmaas-gate
    needs_readiness: true
    suite: vmaas
    filters: [vmaas-outside-known-safe]
    filters_any: [e2e-code, e2e-suite]
  e2e-caas:
    kind: e2e
    check: e2e-caas-gate
    needs_readiness: true
    suite: caas
    filters: [caas-outside-known-safe]
    filters_any: [e2e-code, e2e-suite]
  e2e-bmaas:
    kind: e2e
    check: e2e-bmaas-gate
    needs_readiness: true
    suite: bmaas/sanity
    filters: [bmaas-outside-known-safe]
    filters_any: [e2e-code, e2e-suite]

  pre-commit: {check: pre-commit}
  proto-generated: {check: "Check generated code (proto)", filters: [proto-check]}
  python-checks: {check: "Check Python code", filters: [fulfillment-service-checks]}
  go-proto-checks: {check: "Check Go and proto code", filters: [fulfillment-service-checks]}
  build-binaries: {check: "Build binaries", filters: [fulfillment-service-checks]}
  ansible-lint: {check: ansible-lint, filters: [ansible-osac-aap]}
  dependency-review: {check: dependency-review}
  darwin-keychain: {check: "Run darwin keychain tests", filters: [darwin-keychain]}

  unit-tests: {check: "Run unit tests", filters: [code, unit-tests-fulfillment-service]}
  unit-tests-metering: {check: "Run unit tests (osac-metering)", filters: [code, unit-tests-osac-metering]}
  unit-tests-metering-adapters:
    check: "Run unit tests (osac-metering/adapters)"
    filters: [code, unit-tests-osac-metering-adapters]
  unit-tests-metering-schema:
    check: "Run unit tests (osac-metering/schema)"
    filters: [code, unit-tests-osac-metering-schema]
  unit-tests-operator: {check: "Run unit tests (osac-operator)", filters: [build-osac-operator]}
  unit-tests-bmf:
    check: "Run unit tests (bare-metal-fulfillment-operator)"
    filters: [build-bare-metal-fulfillment-operator]

  integration-fulfillment-service:
    check: "Run integration test (fulfillment-service)"
    filters: [code, integration-tests-fulfillment-service]
  integration-operator:
    check: "Run integration test (osac-operator)"
    filters: [code, integration-tests-osac-operator]
  integration-aap:
    check: "Run integration test (osac-aap)"
    filters: [code, integration-tests-osac-aap]
  integration-installer: {check: "Run integration test (osac-installer)", filters: [code]}
  integration-bmf:
    check: "Run integration test (bare-metal-fulfillment-operator)"
    filters: [code, integration-tests-bare-metal-fulfillment-operator]

  # Required only for the folder they belong to. These workflows run on pull_request with a trigger-level `paths:` and
  # never on the merge queue, so they are required at pr time only. They are not in the ruleset's 26: today a broken
  # osac-ui lint or typecheck does not block the merge. Listing them makes them mandatory exactly when osac-ui changes.
  osac-ui-lint: {check: Lint, paths: ["osac-ui/**"], required_at: [pr]}
  osac-ui-lint-proxy: {check: "Lint proxy (Go)", paths: ["osac-ui/**"], required_at: [pr]}
  osac-ui-typecheck: {check: Typecheck, paths: ["osac-ui/**"], required_at: [pr]}
  unit-tests-osac-ui: {check: "Run unit tests (osac-ui)", paths: ["osac-ui/**"], required_at: [pr]}

  helm-lint-installer:
    check: "Lint Helm charts (osac-installer)"
    filters_any:
      - helm-osac-installer
      - helm-osac-operator
      - helm-bare-metal-fulfillment-operator
      - helm-fulfillment-service
      - helm-osac-aap
      - helm-osac-csi-driver
      - helm-osac-metering
  helm-crd-sync-operator: {check: "Check Helm CRD sync (osac-operator)", filters: [helm-osac-operator]}
  helm-crd-sync-bmf:
    check: "Check Helm CRD sync (bare-metal-fulfillment-operator)"
    filters: [helm-bare-metal-fulfillment-operator]
