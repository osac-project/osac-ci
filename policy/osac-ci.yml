# Policy for this repository's own pull requests. It is the rehearsal for the OSAC policy: the same planner, the same
# published check, but approval comes from native reviews and the jobs are this repo's CI jobs.
version: 1
repo: osac-project/osac-ci

merge:
  required_labels: []
  blocking_labels: []

# GitHub requires a code owner here (see CODEOWNERS and the ruleset); the planner applies the same rule, so it says
# "ready" only when GitHub does, and keeps an approval alive across a rebase. Owner teams are expanded with the
# organization-read token (OSAC_CI_ORG_TOKEN); without it the verdict is a planner error, never a pass.
approval:
  min_approvals: 1
  require_code_owners: true
  carry_over: trivial-rebase

# A fork PR from someone outside the org may not use secrets or start expensive jobs until an org member comments
# `/ok-to-test <sha>` for that exact commit; a new push needs a new authorization. See osac_ci/rules/fork.py.
trust:
  authorization: sha-bound

jobs:
  lint: {check: lint}
  unit-tests: {check: unit-tests}
  legacy-differential: {check: legacy-differential}
